name: "Generate GitHub Stats"

on:
  schedule:
    - cron: '0 0 * * *' # Jalankan setiap hari jam 00:00 UTC
  workflow_dispatch: # Biarkan dijalankan secara manual

jobs:
  generate:
    permissions:
      contents: write # Izin untuk commit ke repository
    runs-on: ubuntu-latest
    name: Generate Stats SVG
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate the stats images
        uses: lowlighter/metrics@latest # Menggunakan tools metrics yang sudah terbukti[reference:9]
        with:
          filename: metrics.svg
          token: ${{ secrets.ACCESS_TOKEN }}
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Jakarta
          plugin_languages: yes
          plugin_languages_details: bytes-percentage, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          plugin_languages_ignored: html, css, dockerfile, shell

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.svg
          git commit -m "Update GitHub stats [skip ci]" || echo "No changes to commit"
          git push