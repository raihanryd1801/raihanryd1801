name: Update GitHub Stats

on:
  schedule:
    # Jalankan setiap hari jam 00:00 UTC
    - cron: '0 0 * * *'
  # Bisa juga di-trigger manual dari tab Actions
  workflow_dispatch:

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download GitHub Stats
        run: |
          curl -o stats.svg \
            "https://github-readme-stats.vercel.app/api?username=raihanryd1801&show_icons=true&hide_border=true&theme=tokyonight&rank_icon=github"

      - name: Download GitHub Streak
        run: |
          curl -o streak.svg \
            "https://streak-stats.demolab.com/?user=raihanryd1801&hide_border=true&theme=tokyonight"

      - name: Download Top Languages
        run: |
          curl -o langs.svg \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=raihanryd1801&layout=donut&hide_border=true&theme=tokyonight"

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg streak.svg langs.svg
          git diff --staged --quiet || git commit -m "Update GitHub stats [skip ci]"
          git push
